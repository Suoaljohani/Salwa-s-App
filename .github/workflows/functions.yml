name: Deploy Supabase edge functions

# Migrations are applied by the Supabase GitHub integration; edge functions are not,
# so they are deployed here. Needs the repository secret SUPABASE_ACCESS_TOKEN
# (a personal access token starting with sbp_, from supabase.com → Account → Access Tokens).
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/functions.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: znwlsbaacdvwhlruqzer
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        id: tok
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set; skipping function deploy."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.tok.outputs.skip != '1'
        with:
          version: latest
      - name: Deploy assistant
        if: steps.tok.outputs.skip != '1'
        run: supabase functions deploy assistant --project-ref "$PROJECT_REF" --use-api
