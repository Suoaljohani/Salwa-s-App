<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1E22" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#E9EFEE" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="سلوى" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/JannaLT-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <title>مساعد الإحصاء</title>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('salwa.prefs.v1') || '{}');
        var d = document.documentElement;
        var t = p.theme === 'light' || p.theme === 'dark' ? p.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        d.dataset.theme = t;
        if (p.reduceTransparency) d.dataset.transparency = 'reduced';
        if (p.reduceMotion) d.dataset.motion = 'reduced';
        if (p.fontScale) d.style.setProperty('--font-scale', String(p.fontScale));
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
